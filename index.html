<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1565C0" />
  <title>Mueblimex</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ====================== SPLASH / LOADER ====================== -->
  <div id="app-loader" class="app-loader">
    <div class="loader-logo">Mueblimex</div>
    <div class="spinner"></div>
  </div>

  <!-- ====================== CONTENEDOR PRINCIPAL ====================== -->
  <!-- Aquí cada módulo inyecta su HTML mediante JS (router.js) -->
  <main id="app-root" class="app-root"></main>

  <!-- ====================== BARRA DE NAVEGACIÓN INFERIOR ====================== -->
  <!-- Solo visible cuando hay sesión iniciada. Se controla desde router.js -->
  <nav id="bottom-nav" class="bottom-nav hidden">
    <button class="nav-item active" data-route="inicio">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </span>
      <span class="nav-label">Inicio</span>
    </button>
    <button class="nav-item" data-route="clientes">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </span>
      <span class="nav-label">Clientes</span>
    </button>
    <button class="nav-item" data-route="mapa">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
      </span>
      <span class="nav-label">Mapa</span>
    </button>
    <button class="nav-item" data-route="entregas">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
      </span>
      <span class="nav-label">Entregas</span>
    </button>
    <button class="nav-item" data-route="perfil">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      </span>
      <span class="nav-label">Perfil</span>
    </button>
  </nav>

  <!-- ====================== CONTENEDOR DE TOASTS ====================== -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ====================== MODAL GENÉRICO ====================== -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <!-- ====================== SCRIPTS ====================== -->
  <!-- 1. SDK de Firebase (versión modular vía CDN) -->
  <script type="module" src="js/firebase-config.js"></script>

  <!-- 2. Lógica de la app. Todo es type=module para poder usar import/export -->
  <script type="module" src="js/app.js"></script>

  <!-- 3. Registro del Service Worker (hace que sea instalable como app) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js")
          .then(() => console.log("Service Worker registrado"))
          .catch((e) => console.warn("No se pudo registrar el SW:", e));
      });
    }
  </script>
</body>
</html>
